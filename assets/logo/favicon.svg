<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" role="img" aria-label="AEI Monogram Emblem">
  <!-- Pointy-topped Hexagon Outer Frame -->
  <polygon points="36,4 66,21.32 66,50.68 36,68 6,50.68 6,21.32" fill="#0A2540" />
  <polygon points="36,8 62.5,23.32 62.5,48.68 36,64 9.5,48.68 9.5,23.32" fill="#FFFFFF" />
  
  <!-- Stylized Geometric "AEI" Monogram -->
  <g fill="#0A2540">
    <!-- Letter 'A' (Left) -->
    <path d="M 14,48.5 L 14,26 L 22.5,21.1 L 22.5,48.5 L 18.5,48.5 L 18.5,37.5 L 18,37.5 L 18,48.5 Z M 18,27.5 L 18,33.5 L 18.5,33.5 L 18.5,27.2 Z"/>
    
    <!-- Letter 'E' (Center) -->
    <path d="M 26,19.2 L 35.5,14 L 35.5,19.2 L 30.5,22 L 30.5,32.5 L 35,32.5 L 35,37 L 30.5,37 L 30.5,48.5 L 35.5,51.3 L 35.5,56.5 L 26,51.2 Z"/>
    
    <!-- Letter 'I' (Right) -->
    <path d="M 40,22 L 48.5,27 L 48.5,46.5 L 40,41.5 Z"/>
  </g>
</svg>
